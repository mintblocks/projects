name: projects

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          repository: mintblocks/projects
          ref: develop
          path: projects-src

      - name: npm install
        working-directory: projects-src
        run: npm install
      
      - name: npm ci
        working-directory: projects-src
        run: npm ci

      - name: build static files
        working-directory: projects-src
        run: npm run build
        env:
          NODE_ENV: production
          ROOT: /projects/

      - name: stop existing pm2 process
        run: npx pm2 delete webpage
        continue-on-error: true

      - name: run
        run: npx pm2 start cmd.exe --name "webpage" -- /c npx serve build -p 4321 --single